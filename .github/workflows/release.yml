name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: tar -czf musik-${{ github.ref_name }}-${{ matrix.arch }}.tar.gz -C target/release musik
      - uses: softprops/action-gh-release@v2
        with:
          files: musik-${{ github.ref_name }}-${{ matrix.arch }}.tar.gz

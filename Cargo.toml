[package]
name = "musik"
version = "0.1.2"
edition = "2021"

[profile.dev]
# Menos símbolos debug (backtraces con líneas, sin locales): target chico,
# rebuilds igual de rápidos. `cargo clean` + rebuild si ya pesa mucho.
debug = "line-tables-only"

[profile.release]
strip = true
lto = true

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
base64 = "0.22"
ansi-to-tui = "7"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ratatui-image = "7"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
